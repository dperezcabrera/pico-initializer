<!DOCTYPE html>
<html lang="en" data-scheme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pico-initializer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233f51b5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* === Material for MkDocs tokens === */
    :root {
      --md-primary: #3f51b5;
      --md-accent: #536dfe;
      --md-bg: #ffffff;
      --md-surface: #ffffff;
      --md-on-bg: rgba(0,0,0,.87);
      --md-on-bg-medium: rgba(0,0,0,.54);
      --md-on-bg-light: rgba(0,0,0,.38);
      --md-divider: rgba(0,0,0,.07);
      --md-hover: rgba(0,0,0,.03);
      --md-on-primary: #fff;
      --md-code-bg: #f5f5f5;
      --md-shadow: 0 2px 4px -1px rgba(0,0,0,.1), 0 4px 5px rgba(0,0,0,.06);
    }
    [data-scheme="slate"] {
      --md-bg: #303030;
      --md-surface: #212121;
      --md-on-bg: rgba(255,255,255,.87);
      --md-on-bg-medium: rgba(255,255,255,.60);
      --md-on-bg-light: rgba(255,255,255,.38);
      --md-divider: rgba(255,255,255,.07);
      --md-hover: rgba(255,255,255,.04);
      --md-code-bg: #272727;
      --md-shadow: 0 2px 4px -1px rgba(0,0,0,.3), 0 4px 5px rgba(0,0,0,.2);
    }

    /* === Reset & base === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: var(--md-on-bg);
      background: var(--md-bg);
      -webkit-font-smoothing: antialiased;
    }

    /* === Header — identical to mkdocs-material === */
    .md-header {
      background: var(--md-primary);
      box-shadow: var(--md-shadow);
      position: sticky; top: 0; z-index: 10;
    }
    .md-header__inner {
      max-width: 61rem;
      margin: 0 auto;
      padding: 0 1.2rem;
      height: 3rem;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .md-header__title {
      color: var(--md-on-primary);
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .02em;
    }
    .md-header__icon { color: rgba(255,255,255,.7); display: flex; }
    .md-header__spacer { flex: 1; }
    .md-header__toggle {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.7);
      display: flex; align-items: center; padding: 4px;
      border-radius: 50%;
      transition: background .15s;
    }
    .md-header__toggle:hover { background: rgba(255,255,255,.1); }

    /* === Content container === */
    .md-content {
      max-width: 61rem;
      margin: 0 auto;
      padding: 2rem 1.2rem 4rem;
    }

    /* === Typography === */
    .label {
      display: block;
      font-size: .64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--md-on-bg-light);
      margin-bottom: .35rem;
    }

    /* === Inputs — Material underline style === */
    .field-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--md-divider);
      padding: .4rem 0;
      font-size: .85rem;
      color: var(--md-on-bg);
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .field-input::placeholder { color: var(--md-on-bg-light); }
    .field-input:focus { border-bottom-color: var(--md-primary); }
    select.field-input { appearance: none; cursor: pointer; }

    /* === Checkbox rows === */
    .mod-row {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .45rem .6rem;
      margin: 0 -.6rem;
      border-radius: .25rem;
      cursor: pointer;
      transition: background .12s;
    }
    .mod-row:hover { background: var(--md-hover); }
    .mod-row input[type="checkbox"] { accent-color: var(--md-primary); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .mod-name { font-size: .82rem; font-weight: 500; color: var(--md-on-bg); min-width: 7.5rem; }
    .mod-desc { font-size: .75rem; color: var(--md-on-bg-medium); }
    .mod-row.hidden-by-filter { display: none; }

    /* === Sections === */
    .section-title {
      font-size: .64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--md-on-bg-light);
      margin-bottom: .75rem;
    }
    /* === Grid === */
    .top-row { display: flex; gap: 0; margin-bottom: 2.5rem; }
    .top-left { display: flex; gap: 1.5rem; flex: 7; }
    .top-right { flex: 3; display: flex; align-items: end; justify-content: end; }
    .cols { display: flex; }
    .col-modules { flex: 5; }
    .col-extras { flex: 2; padding-left: 2.5rem; }
    .col-examples { flex: 2.5; padding-left: 2.5rem; }
    @media (max-width: 768px) {
      .top-row { flex-direction: column; gap: 1.5rem; }
      .top-left { flex-direction: column; }
      .cols { flex-direction: column; gap: 1.5rem; }
      .col-extras, .col-examples { padding-left: 0; }
    }

    /* === Button — Material filled === */
    .md-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1.4rem;
      font-size: .8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--md-on-primary);
      background: var(--md-primary);
      border: none;
      border-radius: .25rem;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: background .15s, box-shadow .15s;
    }
    .md-btn:hover { background: #3949ab; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
    .md-btn:active { background: #303f9f; }
    .md-btn:disabled { opacity: .3; cursor: not-allowed; }

    /* === File preview === */
    .file-list {
      columns: 2;
      gap: 2rem;
      font-family: 'Roboto Mono', monospace;
      font-size: .75rem;
      color: var(--md-on-bg-medium);
      line-height: 1.8;
    }
    @media (max-width: 640px) { .file-list { columns: 1; } }

    /* === Footer === */
    .md-footer {
      max-width: 61rem;
      margin: 0 auto;
      padding: 0 1.2rem 2rem;
      font-size: .7rem;
      color: var(--md-on-bg-light);
      text-align: center;
    }
    .md-footer a { color: var(--md-on-bg-light); text-decoration: none; }
    .md-footer a:hover { color: var(--md-primary); }

    /* === Filter input === */
    .filter-input {
      width: 7rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--md-divider);
      padding: .2rem 0 .2rem 1.3rem;
      font-size: .75rem;
      color: var(--md-on-bg);
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .filter-input::placeholder { color: var(--md-on-bg-light); }
    .filter-input:focus { border-bottom-color: var(--md-primary); }

    /* === Example links === */
    .example-link {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem 0; cursor: pointer;
      font-size: .82rem; font-weight: 500;
      color: var(--md-primary);
      text-decoration: none;
      transition: opacity .15s;
    }
    .example-link:hover { text-decoration: underline; }
    .example-link.disabled {
      color: var(--md-on-bg-light);
      pointer-events: none; opacity: .4;
      cursor: default;
    }
    .example-link svg { flex-shrink: 0; }
    .example-req { display: block; font-size: .65rem; font-weight: 400; color: var(--md-on-bg-light); margin-top: .1rem; }

    /* === Extras === */
    .extra-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .45rem 0; cursor: pointer;
    }
    .extra-row input[type="checkbox"] { accent-color: var(--md-primary); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
    .extra-name { font-size: .82rem; font-weight: 500; color: var(--md-on-bg); }
    .extra-hint { font-size: .65rem; color: var(--md-on-bg-light); display: block; margin-top: .1rem; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="md-header">
    <div class="md-header__inner">
      <span class="md-header__icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </span>
      <span class="md-header__title">pico-initializer</span>
      <span class="md-header__spacer"></span>
      <button class="md-header__toggle" id="theme-toggle" title="Toggle dark mode">
        <svg id="icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg id="icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Content -->
  <div class="md-content">

    <form id="initializer-form">

      <!-- Top row: fields (70%) + generate (30%) -->
      <div class="top-row">
        <div class="top-left">
          <div style="flex:1;">
            <span class="label">Project name</span>
            <input type="text" id="project-name" class="field-input" placeholder="my-service" required>
          </div>
          <div style="width:5.5rem; flex-shrink:0;">
            <span class="label">Python</span>
            <select id="python-version" class="field-input">
              <option value="3.11">3.11</option>
              <option value="3.12" selected>3.12</option>
              <option value="3.13">3.13</option>
              <option value="3.14">3.14</option>
            </select>
          </div>
        </div>
        <div class="top-right">
          <button type="submit" id="generate-btn" class="md-btn" style="white-space:nowrap;">
            Generate
          </button>
        </div>
      </div>

      <!-- Modules + Extras + Examples -->
      <div class="cols">

        <!-- Modules (50%) -->
        <div class="col-modules">
          <div style="position:relative; margin-bottom:.75rem;">
            <svg style="position:absolute; left:0; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--md-on-bg-light);" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="module-search" class="filter-input" placeholder="Filter modules" style="width:100%;">
          </div>

          <div id="modules-list">
            <label class="mod-row" data-search="pico-fastapi rest api web controllers http routes">
              <input type="checkbox" name="module" value="fastapi" checked>
              <span class="mod-name">pico-fastapi</span>
              <span class="mod-desc">REST API with controllers</span>
            </label>
            <label class="mod-row" data-search="pico-sqlalchemy database orm models repositories sql entities">
              <input type="checkbox" name="module" value="sqlalchemy">
              <span class="mod-name">pico-sqlalchemy</span>
              <span class="mod-desc">Database ORM + repositories</span>
            </label>
            <label class="mod-row" data-search="pico-celery background tasks workers queue async jobs">
              <input type="checkbox" name="module" value="celery">
              <span class="mod-name">pico-celery</span>
              <span class="mod-desc">Background tasks</span>
            </label>
            <label class="mod-row" data-search="pico-pydantic validation input schema pydantic">
              <input type="checkbox" name="module" value="pydantic">
              <span class="mod-name">pico-pydantic</span>
              <span class="mod-desc">Method-level validation</span>
            </label>
            <label class="mod-row" data-search="pico-agent llm agents tools ai chatbot langchain">
              <input type="checkbox" name="module" value="agent">
              <span class="mod-name">pico-agent</span>
              <span class="mod-desc">LLM agents + tools</span>
            </label>
            <label class="mod-row" data-search="pico-client-auth jwt rbac authentication authorization token security roles">
              <input type="checkbox" name="module" value="auth">
              <span class="mod-name">pico-client-auth</span>
              <span class="mod-desc">JWT + RBAC</span>
            </label>
          </div>
          <p id="no-results" style="display:none; padding:.8rem 0; font-size:.75rem; color:var(--md-on-bg-light);">No matches.</p>
        </div>

        <!-- Extras (20%) -->
        <div class="col-extras">
          <span class="section-title">Options</span>
          <label class="extra-row">
            <input type="checkbox" id="include-tests" checked>
            <span class="extra-name">Tests</span>
          </label>
          <label class="extra-row">
            <input type="checkbox" id="include-docker">
            <span class="extra-name">Dockerfile</span>
          </label>
          <label class="extra-row">
            <input type="checkbox" id="include-compose">
            <span class="extra-name">Compose</span>
          </label>
          <label class="extra-row">
            <input type="checkbox" id="include-auth-server">
            <span class="extra-name">pico-auth</span>
          </label>
        </div>

        <!-- Examples (30%) -->
        <div class="col-examples" id="examples-col">
          <span class="section-title">Examples</span>

          <a class="example-link" id="ex-crud" data-requires="fastapi,sqlalchemy" href="#">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <div>
              Products CRUD
              <span class="example-req">fastapi + sqlalchemy</span>
            </div>
          </a>

        </div>

      </div>

    </form>

    <!-- File preview -->
    <div id="preview" style="display:none; margin-top:2rem;">
      <span class="section-title" style="display:block; margin-bottom:.5rem;">Generated files</span>
      <ul id="file-list" class="file-list"></ul>
    </div>

  </div>

  <footer class="md-footer">
    <a href="https://github.com/dperezcabrera/pico-initializer">pico-initializer</a>
    <span style="margin:0 .3rem;">&middot;</span>
    <a href="https://github.com/dperezcabrera/pico-boot">pico-boot</a>
    <span style="margin:0 .3rem;">&middot;</span>
    <a href="https://github.com/dperezcabrera/pico-skills">pico-skills</a>
  </footer>

<script src="vendor/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  // Theme toggle
  const html = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const iconLight = document.getElementById('icon-light');
  const iconDark = document.getElementById('icon-dark');

  const saved = localStorage.getItem('scheme');
  if (saved) html.dataset.scheme = saved;
  else if (matchMedia('(prefers-color-scheme: dark)').matches) html.dataset.scheme = 'slate';
  updateIcons();

  toggle.addEventListener('click', () => {
    html.dataset.scheme = html.dataset.scheme === 'slate' ? 'default' : 'slate';
    localStorage.setItem('scheme', html.dataset.scheme);
    updateIcons();
  });

  function updateIcons() {
    const dark = html.dataset.scheme === 'slate';
    iconLight.style.display = dark ? 'none' : 'block';
    iconDark.style.display = dark ? 'block' : 'none';
  }

  // Module filter
  const search = document.getElementById('module-search');
  const modRows = document.querySelectorAll('#modules-list .mod-row');
  const noResults = document.getElementById('no-results');

  search.addEventListener('input', () => {
    const q = search.value.toLowerCase().trim();
    let visible = 0;
    modRows.forEach(row => {
      const match = !q || row.getAttribute('data-search').includes(q);
      row.classList.toggle('hidden-by-filter', !match);
      if (match) visible++;
    });
    noResults.style.display = visible > 0 ? 'none' : 'block';
  });

  // Example links: enable/disable based on selected modules
  const exampleLinks = document.querySelectorAll('.example-link');

  function updateExamples() {
    const checked = [...document.querySelectorAll('input[name="module"]:checked')].map(e => e.value);
    exampleLinks.forEach(link => {
      const reqs = link.dataset.requires.split(',');
      const ok = reqs.every(r => checked.includes(r));
      link.classList.toggle('disabled', !ok);
    });
  }

  document.querySelectorAll('input[name="module"]').forEach(cb =>
    cb.addEventListener('change', updateExamples)
  );
  updateExamples();

  // pico-auth check auto-enables Compose
  const authServerCb = document.getElementById('include-auth-server');
  const composeCb = document.getElementById('include-compose');
  authServerCb.addEventListener('change', () => {
    if (authServerCb.checked) composeCb.checked = true;
  });
  composeCb.addEventListener('change', () => {
    if (!composeCb.checked) authServerCb.checked = false;
  });

  // Example download: generate project with example included
  document.getElementById('ex-crud').addEventListener('click', (e) => {
    e.preventDefault();
    if (e.currentTarget.classList.contains('disabled')) return;
    // Dispatch a custom event that app.js listens for
    document.dispatchEvent(new CustomEvent('download-example', { detail: 'crud' }));
  });
</script>
</body>
</html>
